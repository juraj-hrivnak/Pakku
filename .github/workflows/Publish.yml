name: Publish
run-name: "Publish #${{ github.run_number }}"

concurrency:
  group: publish-${{ github.sha }}
  # Tag runs cancel an in-progress main run for the same commit; main runs never cancel a tag run
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'pakku-core/**'
      - 'pakku-cli/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/Publish.yml'

jobs:
  publish-snaphot:
    name: Publish Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Publish to GitHub Packages
        run: ./gradlew :pakku-core:publish -PsnapshotVersion
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-version:
    name: Verify version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.PUSH_ACCESS_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Verify tag matches project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(./gradlew -q printVersion)
          echo "tag=$TAG version=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match version $VERSION"
            git push origin --delete "$GITHUB_REF_NAME"
            exit 1
          fi

      - name: Cancel workflow on mismatch
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run cancel "${{ github.run_id }}" --repo "${{ github.repository }}"

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [verify-version]
    permissions:
      contents: read
      packages: write
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Publish to GitHub Packages
        run: ./gradlew :pakku-core:publish
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
